<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <script
        src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.4/dist/aframe-physics-system.min.js"></script>
    
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

        #ui {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
            color: white;
            font-family: sans-serif;
            text-shadow: 2px 2px 4px black;
            pointer-events: none;
        }

        #ui h2 {
            margin: 0 0 8px;
        }

        #ui p {
            margin: 4px;
        }

        #power-gauge {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            padding: 12px;
            background: rgba(0, 0, 0, 0.75);
            color: white;
            text-align: center;
            font-family: sans-serif;
            border: 2px solid white;
            border-radius: 10px;
            z-index: 9999;
            box-sizing: border-box;
        }

        #power-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        #power-bar {
            width: 100%;
            height: 22px;
            background: #333;
            border: 1px solid white;
            border-radius: 5px;
            overflow: hidden;
        }

        #power-fill {
            width: 0%;
            height: 100%;
            background: limegreen;
            transition: width 0.05s linear;
        }

        #power-text {
            margin-top: 5px;
            font-size: 16px;
            font-weight: bold;
        }

        #power-help {
            margin-top: 5px;
            font-size: 12px;
            color: #ccc;
        }
    </style>
</head>

<body>

    <body>
        <div id="ui">
            <h2>Cube Crash</h2>
            <p>スペースキー：球を発射</p>
            <p>WASD：移動 R：リセット</p>
        </div>

        <div id="power-gauge">
            <div id="power-title">POWER</div>
            <div id="power-bar">
                <div id="power-fill"></div>
            </div>
            <div id="power-text">0%</div>
            <div id="power-help">SPACE 長押しでチャージ</div>
        </div>

        <a-scene physics="gravity: -9.8" background="color: #b9d4e8">


            <a-box position="0 -0.25 -5" width="20" height="0.5" depth="30" color="#777777" static-body>
            </a-box>


            <a-box position="0 3 -20" width="20" height="6" depth="0.5" color="#aaaaaa" static-body>
            </a-box>


            <a-box position="-10 2 -5" width="0.5" height="4" depth="30" color="#999999" static-body>
            </a-box>

            <a-box position="10 2 -5" width="0.5" height="4" depth="30" color="#999999" static-body>
            </a-box>




            <a-box position="-0.95 0.45 -5" width="0.9" height="0.9" depth="0.9" color="#e0a34c"
                dynamic-body="mass: 1"></a-box>
            <a-box position="0 0.45 -5" width="0.9" height="0.9" depth="0.9" color="#e0a34c"
                dynamic-body="mass: 1"></a-box>
            <a-box position="0.95 0.45 -5" width="0.9" height="0.9" depth="0.9" color="#e0a34c"
                dynamic-body="mass: 1"></a-box>

            <a-box position="-0.95 0.45 -4" width="0.9" height="0.9" depth="0.9" color="#d99540"
                dynamic-body="mass: 1"></a-box>
            <a-box position="0 0.45 -4" width="0.9" height="0.9" depth="0.9" color="#d99540"
                dynamic-body="mass: 1"></a-box>
            <a-box position="0.95 0.45 -4" width="0.9" height="0.9" depth="0.9" color="#d99540"
                dynamic-body="mass: 1"></a-box>

            <a-box position="-0.95 0.45 -3" width="0.9" height="0.9" depth="0.9" color="#e0a34c"
                dynamic-body="mass: 1"></a-box>
            <a-box position="0 0.45 -3" width="0.9" height="0.9" depth="0.9" color="#e0a34c"
                dynamic-body="mass: 1"></a-box>
            <a-box position="0.95 0.45 -3" width="0.9" height="0.9" depth="0.9" color="#e0a34c"
                dynamic-body="mass: 1"></a-box>

            <a-box position="-0.45 1.4 -4.45" width="0.9" height="0.9" depth="0.9" color="#f0bd68"
                dynamic-body="mass: 1"></a-box>
            <a-box position="0.45 1.4 -4.45" width="0.9" height="0.9" depth="0.9" color="#f0bd68"
                dynamic-body="mass: 1"></a-box>
            <a-box position="-0.45 1.4 -3.55" width="0.9" height="0.9" depth="0.9" color="#f0bd68"
                dynamic-body="mass: 1"></a-box>
            <a-box position="0.45 1.4 -3.55" width="0.9" height="0.9" depth="0.9" color="#f0bd68"
                dynamic-body="mass: 1"></a-box>


            <a-box position="0 2.35 -4" width="0.9" height="0.9" depth="0.9" color="#ffcf7b" dynamic-body="mass: 1">
            </a-box>



            <a-sphere id="ball" position="0 0.55 3" radius="0.55" color="#eeeeee" dynamic-body="mass: 2">
            </a-sphere>

            <a-camera position="0 2.5 10" rotation="-5 0 0" wasd-controls="acceleration: 15" look-controls>
            </a-camera>

        </a-scene>

        <script>
            const ball = document.querySelector("#ball");
            const fill = document.querySelector("#power-fill");
            const powerText = document.querySelector("#power-text");

            let power = 0;
            let charging = false;
            let launched = false;
            let lastTime = 0;

            const MAX_POWER = 100;
            const CHARGE_SPEED = 50;
            const MIN_SPEED = 5;
            const MAX_SPEED = 25;

            function updateGauge() {
                fill.style.width = power + "%";
                powerText.textContent = Math.floor(power) + "%";

                if (power < 50) {
                    fill.style.background = "limegreen";
                } else if (power < 80) {
                    fill.style.background = "yellow";
                } else {
                    fill.style.background = "red";
                }
            }

            function charge(time) {
                if (!charging) return;

                if (lastTime === 0) lastTime = time;

                const delta = (time - lastTime) / 1000;
                lastTime = time;

                power = Math.min(
                    MAX_POWER,
                    power + CHARGE_SPEED * delta
                );

                updateGauge();
                requestAnimationFrame(charge);
            }

            window.addEventListener("keydown", (event) => {
                if (event.code === "Space") {
                    event.preventDefault();

                    if (launched || charging) return;

                    charging = true;
                    lastTime = 0;
                    requestAnimationFrame(charge);
                }

                if (event.code === "KeyR") {
                    location.reload();
                }
            });

            window.addEventListener("keyup", (event) => {
                if (event.code !== "Space") return;

                event.preventDefault();

                if (!charging || launched) return;

                charging = false;

                const body = ball.components["dynamic-body"]?.body;


                const speed =
                    MIN_SPEED + (MAX_SPEED - MIN_SPEED) * (power / MAX_POWER);

                body.velocity.set(0, 0, -speed);
                body.angularVelocity.set(0, 0, 0);
                body.wakeUp();

                launched = true;
            });
        </script>

    </body>

</html
